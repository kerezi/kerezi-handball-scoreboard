<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>БФХ - "А" РХГ, сезон 2026/27</title>
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<link rel="stylesheet" href="bghndlgoals.css" />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
	<ul class="logo-result" id="scoreboard" fs-if="show_scoreboard">
		<li class="logos place-1-2" fs-if="!!team_x.logo && !!team_y.logo">
			<span>
				<img alt="" src="{{team_x.logo}}" />
				<span style="background: {{team_x.color}}">{{team_x.scores}}</span>
			</span>
		</li>
		<li class="logos place-2-2" fs-if="!!team_x.logo && !!team_y.logo">
			<span>
				<img alt="" src="{{team_y.logo}}" />
				<span style="background: {{team_y.color}}">{{team_y.scores}}</span>
			</span>
		</li>
		<li class="logos line-0">
			{{matchStats[0].value}}
			{{timers.main[0].label}}
		</li>
		<li class="goal place-2-1" fs-if="!!timers.main[0]">
			<span class="goal goal-place-1"> 1 / 2</span>
			<span class="goal goal-place-2">2 / 2</span>
			<span class="goal goal-place-3">3 / 2</span>
			<span class="goal goal-place-4">1 / 1</span>
			<span class="goal goal-place-5">2 / 1</span>
			<span class="goal goal-place-6">3 / 1</span>
		</li>
		<li class="goal place-2-3" fs-if="!!timers.main[0]">
			<span class="goal goal-place-1"></span>
			<span class="goal goal-place-2"></span>
		</li>


		<li class="goal place-2-2" fs-if="!!timers.main[0]">
			<span class="goal goal-place-1"> 1 / 2</span>
			<span class="goal goal-place-2">2 / 2</span>
			<span class="goal goal-place-3">3 / 2</span>
			<span class="goal goal-place-4">1 / 1</span>
			<span class="goal goal-place-5">2 / 1</span>
			<span class="goal goal-place-6">3 / 1</span>
		</li>
	</ul>
	<script src="script.js" defer></script>

</body>

</html>
