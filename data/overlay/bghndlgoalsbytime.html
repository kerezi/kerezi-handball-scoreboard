<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>БФХ - "А" РХГ, сезон 2026/27</title>
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<link rel="stylesheet" href="bghndlgoalsbytime.css" />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
	<ul class="goals-by-time" id="scoreboard" fs-if="show_scoreboard">
		<!-- <li class="bfh-logo"><img alt="" src="logo-color-vertical.png" /></li> -->
		<li class="logos place-1-2" fs-if="!!team_x.logo && !!team_y.logo"><img alt="" src="{{team_x.logo}}" /></li>
		<li class="logos place-2-2" fs-if="!!team_x.logo && !!team_y.logo"><img alt="" src="{{team_y.logo}}" /></li>
		<!-- <li class="names place-1-3" style="background: {{team_x.color}}"><span>{{team_x.subtitle}}</span></li>
		<li class="names place-2-3" style="background: {{team_y.color}}"><span>{{team_y.subtitle}}</span></li> -->
		<li class="scores place-1-4" style="background: {{team_x.color}}">{{team_x.scores}}</li>
		<li class="scores place-2-4" style="background: {{team_y.color}}">{{team_y.scores}}</li>

		<li class="scores line-0" ><hr></li>
		<li class="scores min-0" >0'</li>
		<li class="scores line-1" ><hr></li>
		<li class="scores min-10" >10'</li>
		<li class="scores line-2" ><hr></li>
		<li class="scores min-20" >20'</li>
		<li class="scores line-3" ><hr></li>
		<li class="scores min-30" >30'</li>

	</ul>
	<script src="script.js" defer></script>

</body>

</html>
